# Stack Watchtower séparé — surveille uniquement le conteneur "mediatracker"
# MediaTracker appelle l'API HTTP (Réglages → Jetons → URL + jeton Watchtower)

networks:
  mediatracker_net:
    external: true
    name: mediatracker_net

services:
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    command: mediatracker   # nom du conteneur à surveiller (les autres sont ignorés)
    # Variante par label : command: --label-enable --interval 3600
    # et, dans le compose de MediaTracker : labels: { com.centurylinklabs.watchtower.enable: "true" }
    networks:
      - mediatracker_net
    ports:
      # Expose l'API HTTP sur l'hôte si MediaTracker n'est pas sur le même réseau ;
      # sinon retirez "ports" et utilisez http://watchtower:8080 depuis MediaTracker.
      - "8088:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: Europe/Paris
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_TOKEN: changeme
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
      WATCHTOWER_POLL_INTERVAL: "3600"
      WATCHTOWER_CLEANUP: "true"

# Créez le réseau partagé une fois :
#   docker network create mediatracker_net
# Attachez MediaTracker au même réseau dans son compose :
#   networks: [mediatracker_net]
# Dans MediaTracker (UI) : watchtower_url = http://watchtower:8080 ou http://<hôte>:8088
