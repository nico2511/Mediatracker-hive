# MediaTracker — NAS simple (une instance, Jellyfin ailleurs)
# Usage : copier ce fichier, ajuster les chemins, puis docker compose up -d

services:
  mediatracker:
    image: ghcr.io/nico2511/mediatracker-hive:latest
    container_name: mediatracker
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Paris
      PUID: "1000"
      PGID: "100"
      SECRET_KEY: changeme-generer-un-secret-long
      # Chemins DANS le conteneur — doivent rester sous le même montage /data :
      MOVIES_DIR: /data/Films
      SERIES_DIR: /data/Series
      DOWNLOADS_DIR: /data/.mediatracker/downloads
      TRASH_DIR: /data/.mediatracker/trash
      # Optionnel derrière reverse proxy HTTPS :
      # PUBLIC_URL: https://mediatracker.example.com
      # FORWARDED_ALLOW_IPS: 203.0.113.0/24
    volumes:
      - /chemin/vers/mediatracker/config:/config
      - /chemin/vers/medias:/data
