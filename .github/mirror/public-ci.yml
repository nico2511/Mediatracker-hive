name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Instantané déjà validé côté dépôt privé : pas de suite pytest complète.
# Ici : ruff, build frontend, image + /healthz, puis publication.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check backend tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # Construction amd64 et contrôle que le conteneur répond sur /healthz.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker build -t mediatracker-hive:smoke \
            --build-arg MEDIATRACKER_UPDATE_IMAGE=ghcr.io/nico2511/mediatracker-hive \
            --build-arg IMAGE_SOURCE=https://github.com/nico2511/Mediatracker-hive .
      - name: Générer les identifiants de smoke
        run: |
          secret_key=$(python3 -c 'import secrets; print(secrets.token_hex(32))')
          admin_password=$(python3 -c 'import secrets; print(secrets.token_hex(32))')
          echo "::add-mask::$secret_key"
          echo "::add-mask::$admin_password"
          {
            echo "SECRET_KEY=$secret_key"
            echo "ADMIN_PASSWORD=$admin_password"
          } >> "$GITHUB_ENV"
      - name: Smoke
        run: |
          docker run -d --name mediatracker-smoke \
            -e SECRET_KEY \
            -e ADMIN_PASSWORD \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Europe/Paris \
            -p 8080:8080 \
            mediatracker-hive:smoke
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "Santé indisponible" >&2
          docker logs mediatracker-smoke >&2 || true
          exit 1

  publish:
    needs: [check, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: built
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nico2511/mediatracker-hive:latest
            ghcr.io/nico2511/mediatracker-hive:sha-${{ steps.built.outputs.short_sha }}
          build-args: |
            APP_VERSION=${{ steps.built.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.built.outputs.date }}
            MEDIATRACKER_UPDATE_IMAGE=ghcr.io/nico2511/mediatracker-hive
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
