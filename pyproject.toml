[project]
name = "mediatracker"
version = "2.0.0"
description = "MediaTracker — gestionnaire de médias API-first pour le LAN."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "websockets>=13",
    "itsdangerous>=2.2",
    "cryptography>=43",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "jinja2>=3.1.6",
    "pytest>=8.3",
    "pyyaml>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
"mediatracker.core" = [".build-id"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "UP017"]

[tool.ruff.lint.per-file-ignores]
"backend/mediatracker/db/migrations/versions/*.py" = ["E501"]
"tests/test_pwa_offline.py" = ["E501"]
