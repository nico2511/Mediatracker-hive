      - name: MediaTracker file attente
        unique_id: mediatracker_file_attente
        default_entity_id: sensor.mediatracker_file_attente
        icon: mdi:playlist-clock
        state: >
          {% set raw = states('input_text.mediatracker_file_attente') %}
          {% if raw in ['unknown', 'unavailable', 'none', 'None'] %}{% set raw = '' %}{% endif %}
          {% set ns = namespace(n=0) %}
          {% for part in raw.split(',') %}
          {% set bits = part.split(':') %}
          {% if bits | length == 3 and bits[2] == 'a' and bits[0] | int(0) > 0 %}{% set ns.n = ns.n + 1 %}{% endif %}
          {% endfor %}
          {{ ns.n }}
        attributes:
          rows: *queue_rows
          next: *queue_next
      - name: MediaTracker attente 01
        unique_id: mediatracker_attente_01
        default_entity_id: sensor.mediatracker_attente_01
        icon: mdi:bookmark-outline
        state: >
          {% set raw = state_attr('sensor.mediatracker_file_attente', 'rows') | default('', true) %}
          {% set items = raw.split(',') | reject('equalto', '') | list %}
          {% set row = items[0] if items | length > 0 else '' %}
          {% if row.endswith(':a') or row.endswith(':h') %}en attente{% elif row.endswith(':e') %}envoyé{% else %}vide{% endif %}
        attributes:
          label: >
            {% set raw = state_attr('sensor.mediatracker_file_attente', 'rows') | default('', true) %}
            {% set items = raw.split(',') | reject('equalto', '') | list %}
            {% set row = items[0] if items | length > 0 else '' %}
            {{ 'TMDB #' ~ row.split(':')[0] if row else '—' }}
          type: >
            {% set raw = state_attr('sensor.mediatracker_file_attente', 'rows') | default('', true) %}
            {% set items = raw.split(',') | reject('equalto', '') | list %}
            {% set row = items[0] if items | length > 0 else '' %}
            {{ 'Série' if row.split(':')[1] | default('') == 't' else ('Film' if row else '—') }}

