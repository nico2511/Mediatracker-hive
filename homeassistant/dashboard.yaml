# Tableau de bord Lovelace. La vue est custom:grid-layout (layout-card), pas une colonne unique.
# Bureau : 3 colonnes, affiches sur deux, Suivre et la file à droite.
# Téléphone (max-width 839 px) : la mediaquery de layout-card empile les mêmes blocs.
# Affiches : 76 px, alignées au début. Les capteurs vides ne réservent pas de place.
# Adresse : sensor.mediatracker_adresse (!secret mediatracker_url dans le package). Aucun jeton.
title: MediaTracker
views:
- title: MediaTracker
  path: mediatracker
  type: custom:grid-layout
  layout:
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) minmax(0, 1fr)
    grid-template-rows: auto
    grid-template-areas: |-
      "status downloads watch"
      "sorties sorties suivre"
      "antenne antenne queue"
    grid-gap: 12px
    place-items: start stretch
    mediaquery:
      '(max-width: 839px)':
        grid-template-columns: 100%
        grid-template-areas: |-
          "status"
          "downloads"
          "watch"
          "sorties"
          "antenne"
          "suivre"
          "queue"
        place-items: start stretch
  cards:
  - type: custom:mod-card
    view_layout:
      grid-area: status
    card_mod:
      style: |-
        ha-card {
          background: #161618 !important;
          border-radius: 16px !important;
          border: 1px solid rgba(255,255,255,0.06) !important;
          box-shadow: none !important;
          padding: 6px !important;
          margin: 0 !important;
        }
    card:
      type: vertical-stack
      cards:
      - type: custom:mushroom-title-card
        title: MediaTracker
        card_mod:
          style: |-
            ha-card {
              background: transparent !important;
              box-shadow: none !important;
              border: none !important;
              margin: 0 !important;
              --title-padding: 6px 8px 2px;
              --title-font-size: 15px;
            }
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr 1fr 1fr
          grid-gap: 8px
          place-items: stretch
          mediaquery:
            '(min-width: 840px)':
              grid-template-columns: 1fr
        card_mod:
          style: |-
            ha-card {
              background: transparent !important;
              box-shadow: none !important;
              border: none !important;
              padding: 0 !important;
              margin: 0 !important;
            }
        cards:
        - type: custom:mushroom-entity-card
          entity: sensor.mediatracker_sante
          name: Santé
          icon: mdi:heart-pulse
          icon_color: '{{ ''green'' if is_state(''sensor.mediatracker_sante'', ''ok'') else (''red'' if states(''sensor.mediatracker_sante'')
            in [''indisponible'', ''unavailable'', ''unknown''] else ''amber'') }}'
          layout: horizontal
          primary_info: name
          secondary_info: state
          card_mod:
            style: |-
              ha-card {
                background: rgba(255,255,255,0.04) !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 12px !important;
                margin: 0 !important;
                --icon-size: 22px;
                --card-primary-font-size: 13px;
                --card-secondary-font-size: 12px;
              }
        - type: custom:mushroom-entity-card
          entity: sensor.mediatracker_disque
          name: Disque
          icon: mdi:harddisk
          icon_color: amber
          layout: horizontal
          primary_info: name
          secondary_info: state
          card_mod:
            style: |-
              ha-card {
                background: rgba(255,255,255,0.04) !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 12px !important;
                margin: 0 !important;
                --icon-size: 22px;
                --card-primary-font-size: 13px;
                --card-secondary-font-size: 12px;
              }
        - type: custom:mushroom-entity-card
          entity: sensor.mediatracker_version
          name: Version
          icon: mdi:tag-outline
          icon_color: purple
          layout: horizontal
          primary_info: name
          secondary_info: state
          card_mod:
            style: |-
              ha-card {
                background: rgba(255,255,255,0.04) !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 12px !important;
                margin: 0 !important;
                --icon-size: 22px;
                --card-primary-font-size: 13px;
                --card-secondary-font-size: 12px;
              }
      - type: horizontal-stack
        cards:
        - type: custom:button-card
          name: Mise à jour
          icon: mdi:update
          show_name: true
          show_icon: true
          size: 16px
          tap_action:
            action: call-service
            service: script.mediatracker_verifier_mise_a_jour
          styles:
            card:
            - height: 34px
            - padding: 0 10px
            - border-radius: 10px
            - box-shadow: none
            - background: rgba(255,255,255,0.06)
            name:
            - font-size: 12px
            - font-weight: '500'
            - color: '#e8e8ee'
            icon:
            - width: 16px
            - color: '#d0d0d6'
            grid:
            - grid-template-areas: '"i n"'
            - grid-template-columns: 16px 1fr
            - column-gap: 6px
            - align-items: center
            - justify-items: center
        - type: custom:button-card
          name: Redémarrer
          icon: mdi:restart
          show_name: true
          show_icon: true
          size: 16px
          tap_action:
            action: call-service
