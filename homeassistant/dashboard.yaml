          margin: 0 !important;
        }
    card:
      type: vertical-stack
      cards:
      - type: custom:mushroom-title-card
        title: File d'attente (NAS éteint)
        card_mod:
          style: |-
            ha-card {
              background: transparent !important;
              box-shadow: none !important;
              border: none !important;
              margin: 0 !important;
              --title-padding: 6px 8px 2px;
              --title-font-size: 15px;
            }
      - type: conditional
        conditions:
        - condition: template
          value_template: '{{ states(''input_text.mediatracker_file_attente'') | trim in ['''', ''unknown'', ''unavailable'',
            ''none''] }}'
        card:
          type: markdown
          content: Aucun identifiant en file.
          card_mod:
            style: |-
              ha-card {
                background: transparent !important;
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
              }
              ha-markdown { padding: 0 8px 6px !important; font-size: 12px; color: #9a9aa3; }
      - type: custom:auto-entities
        show_empty: false
        unique: true
        card:
          type: vertical-stack
        card_param: cards
        sort:
          method: entity_id
        filter:
          include:
          - entity_id: sensor.mediatracker_attente_*
            not:
              state: vide
            options:
              type: custom:button-card
              entity: this.entity_id
              show_icon: false
              show_name: false
              show_state: false
              custom_fields:
                id: '[[[ return entity.attributes.label || ''TMDB'' ]]]'
                badge: '[[[ return entity.state ]]]'
              styles:
                card:
                - padding: 8px 10px
                - margin: 0 0 6px 0
                - background: rgba(255,255,255,0.03)
                - border-radius: 10px
                - box-shadow: none
                grid:
                - grid-template-areas: '"id badge"'
                - grid-template-columns: 1fr auto
                - align-items: center
                custom_fields:
                  id:
                  - justify-self: start
                  - font-size: 14px
                  - font-weight: '500'
                  badge:
                  - justify-self: end
                  - font-size: 11px
                  - font-weight: '600'
                  - padding: 3px 8px
                  - border-radius: 999px
                  - background: '[[[ return entity.state == ''envoyé'' ? ''#14532d'' : ''#7c4a03'' ]]]'
                  - color: '[[[ return entity.state == ''envoyé'' ? ''#86efac'' : ''#fdba74'' ]]]'
