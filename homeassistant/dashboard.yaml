      - type: custom:auto-entities
        show_empty: false
        unique: true
        card_param: cards
        sort:
          method: entity_id
        card:
          type: custom:layout-card
          layout_type: custom:grid-layout
          layout:
            grid-template-columns: repeat(auto-fill, 76px)
            grid-auto-rows: 132px
            grid-gap: 8px
            place-content: start
            place-items: start
          card_mod:
            style: |-
              ha-card {
                background: transparent !important;
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
              }
          cards: []
        filter:
          include:
          - entity_id: sensor.mediatracker_sortie_*
            options:
              type: custom:button-card
              entity: this.entity_id
              icon: mdi:image-outline
              show_entity_picture: true
              show_icon: true
              show_name: false
              show_state: true
              entity_picture: '[[[ const picture = String((entity.attributes && entity.attributes.entity_picture) || '''');
                return /^https?:\/\//.test(picture) ? picture : ''''; ]]]'
              tap_action:
                action: url
                url_path: '[[[ return entity.attributes.tmdb_url || '''' ]]]'
              hold_action:
                action: call-service
                service: script.mediatracker_suivre_sortie
                data:
                  index: '[[[ return Number(String(entity.entity_id).split(''_'').pop()) - 1 ]]]'
              styles:
                card:
                - width: 76px
                - height: 132px
                - padding: 4px
                - box-shadow: none
                - background: '#2a2a2e'
                - border-radius: 10px
                entity_picture:
                - width: 68px
                - height: 100px
                - object-fit: cover
                - border-radius: 8px
                - justify-self: center
                icon:
                - width: 28px
                - color: '#8b8b93'
                state:
                - font-size: 10px
                - white-space: normal
                - overflow: hidden
                - max-height: 26px
                - line-height: 13px
          exclude:
          - entity_id: sensor.mediatracker_sortie_*
            state: —
          - entity_id: sensor.mediatracker_sortie_*
            state: unknown
          - entity_id: sensor.mediatracker_sortie_*
            state: unavailable
          - entity_id: sensor.mediatracker_sortie_*
            state: ''
      - type: markdown
